<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script>
        function onLoad() {
            let pathname = window.location.pathname;
            if (pathname.startsWith('/easy-diet')) {
                window.location.href = 'https://jacobklein.github.io/easy-diet';
                return;
            }
            document.getElementById("main").classList = "";
        }
    </script>

    <style>
        .hidden {
            display: none;
        }

        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
            background: #fff;
            color: #111;
            text-align: center;
        }

        h1 {
            font-size: 5rem;
            font-weight: 700;
        }

        p {
            margin: 1rem 0 2rem;
            color: #666;
        }

        a {
            color: inherit;
            text-decoration: none;
            border: 1px solid #111;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            transition: 0.2s;
        }

        a:hover {
            background: #111;
            color: #fff;
        }
    </style>
</head>
<body onload="onLoad()">
<div id="main" class="hidden">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go Home</a>
</div>
</body>
</html>
